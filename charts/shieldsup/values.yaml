replicaCount: 1

image:
  repository: shieldsup-api
  tag: mvp
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Ingress is off by default. Enable with values and set ingressClassName.
# Do not add cloud-provider annotations to the default chart.
ingress:
  enabled: false
  className: ""
  hosts: []
